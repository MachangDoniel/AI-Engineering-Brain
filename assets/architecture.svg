  <line x1="430" y1="184" x2="466" y2="184" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <line x1="290" y1="212" x2="290" y2="240" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="610" y1="212" x2="610" y2="240" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

