<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#60a5fa"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#34d399"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#f87171"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="520" rx="12" fill="#0f172a"/>
  <text x="480" y="36" text-anchor="middle" fill="#e2e8f0" font-size="20" font-weight="700">Anatomy of an Engineered Loop</text>
  <text x="480" y="58" text-anchor="middle" fill="#64748b" font-size="12" font-style="italic">the human sits at the boundary, not inside the iteration</text>

  <!-- Trigger -->
  <rect x="36" y="86" width="176" height="56" rx="9" fill="#1e293b" stroke="#475569"/>
  <text x="124" y="110" text-anchor="middle" fill="#e2e8f0" font-size="13" font-weight="700">1 · Trigger</text>
  <text x="124" y="128" text-anchor="middle" fill="#94a3b8" font-size="10.5">schedule · CI failure · event</text>

  <line x1="212" y1="114" x2="248" y2="114" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/>

  <!-- Goal -->
  <rect x="250" y="86" width="290" height="56" rx="9" fill="#1e3a5f" stroke="#3b82f6"/>
  <text x="395" y="110" text-anchor="middle" fill="#bfdbfe" font-size="13" font-weight="700">2 · Goal — a verifiable stopping condition</text>
  <text x="395" y="128" text-anchor="middle" fill="#93c5fd" font-size="10.5" font-style="italic">"tests in test/auth pass and lint is clean"</text>

  <!-- Human at the boundary -->
  <rect x="576" y="86" width="200" height="56" rx="9" fill="#1e293b" stroke="#475569" stroke-dasharray="4 3"/>
  <text x="676" y="110" text-anchor="middle" fill="#e2e8f0" font-size="12.5" font-weight="700">Human — writes the goal</text>
  <text x="676" y="128" text-anchor="middle" fill="#94a3b8" font-size="10.5">plan · criteria · rails</text>
  <line x1="576" y1="114" x2="544" y2="114" stroke="#475569" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#arrow)"/>

  <line x1="395" y1="142" x2="395" y2="176" stroke="#60a5fa" stroke-width="1.8" marker-end="url(#arrowBlue)"/>

  <!-- Rails panel -->
  <rect x="36" y="178" width="176" height="216" rx="10" fill="#172033" stroke="#475569"/>
  <text x="124" y="202" text-anchor="middle" fill="#fbbf24" font-size="12.5" font-weight="700">The rails</text>
  <text x="52" y="228" fill="#94a3b8" font-size="10.5">· failure limit (N tries)</text>
  <text x="52" y="250" fill="#94a3b8" font-size="10.5">· tool-call budget</text>
  <text x="52" y="272" fill="#94a3b8" font-size="10.5">· bounded blast radius</text>
  <text x="52" y="294" fill="#94a3b8" font-size="10.5">· approval hooks</text>
  <text x="52" y="316" fill="#94a3b8" font-size="10.5">· logging</text>
  <text x="52" y="338" fill="#94a3b8" font-size="10.5">· escalation path</text>
  <text x="52" y="372" fill="#64748b" font-size="10" font-style="italic">unattended means</text>
  <text x="52" y="386" fill="#64748b" font-size="10" font-style="italic">these are not optional</text>
  <line x1="212" y1="286" x2="246" y2="286" stroke="#fbbf24" stroke-width="1.4" stroke-dasharray="3 3"/>

  <!-- Loop box -->
  <rect x="248" y="178" width="420" height="216" rx="12" fill="none" stroke="#3b82f6" stroke-dasharray="6 4"/>
  <text x="264" y="200" fill="#60a5fa" font-size="11.5" font-weight="700">the loop</text>

  <!-- Maker -->
  <rect x="268" y="216" width="176" height="66" rx="9" fill="#1e293b" stroke="#64748b"/>
  <text x="356" y="240" text-anchor="middle" fill="#e2e8f0" font-size="12.5" font-weight="700">3 · Agent (maker)</text>
  <text x="356" y="257" text-anchor="middle" fill="#94a3b8" font-size="10.5">edit · bash · MCP tools</text>
  <text x="356" y="273" text-anchor="middle" fill="#94a3b8" font-size="10.5">in its own worktree</text>

  <!-- Checker -->
  <rect x="472" y="216" width="176" height="66" rx="9" fill="#1e293b" stroke="#a78bfa"/>
  <text x="560" y="240" text-anchor="middle" fill="#ddd6fe" font-size="12.5" font-weight="700">4 · Verifier (checker)</text>
  <text x="560" y="257" text-anchor="middle" fill="#c4b5fd" font-size="10.5">tests · types · CI</text>
  <text x="560" y="273" text-anchor="middle" fill="#c4b5fd" font-size="10.5">separate, cheaper model</text>

  <line x1="444" y1="249" x2="468" y2="249" stroke="#60a5fa" stroke-width="1.8" marker-end="url(#arrowBlue)"/>

  <!-- iterate edge -->
  <path d="M 560 282 L 560 322 L 356 322 L 356 284" fill="none" stroke="#60a5fa" stroke-width="1.8" marker-end="url(#arrowBlue)"/>
  <text x="458" y="340" text-anchor="middle" fill="#60a5fa" font-size="10.5" font-style="italic">not satisfied → iterate</text>

  <text x="458" y="368" text-anchor="middle" fill="#f87171" font-size="10.5" font-weight="700">the maker never grades its own homework</text>

  <!-- Exits -->
  <line x1="648" y1="238" x2="700" y2="222" stroke="#34d399" stroke-width="1.8" marker-end="url(#arrowGreen)"/>
  <rect x="704" y="196" width="220" height="52" rx="9" fill="#14342b" stroke="#34d399"/>
  <text x="814" y="218" text-anchor="middle" fill="#6ee7b7" font-size="12" font-weight="700">condition holds → exit</text>
  <text x="814" y="235" text-anchor="middle" fill="#34d399" font-size="10.5">open PR · ship · report</text>

  <line x1="648" y1="262" x2="700" y2="286" stroke="#f87171" stroke-width="1.8" marker-end="url(#arrowRed)"/>
  <rect x="704" y="262" width="220" height="52" rx="9" fill="#3b1f24" stroke="#f87171"/>
  <text x="814" y="284" text-anchor="middle" fill="#fca5a5" font-size="12" font-weight="700">limit tripped → escalate</text>
  <text x="814" y="301" text-anchor="middle" fill="#f87171" font-size="10.5">triage inbox a human reads</text>

  <!-- State -->
  <rect x="248" y="412" width="676" height="72" rx="10" fill="#1e3a5f" stroke="#3b82f6"/>
  <text x="586" y="437" text-anchor="middle" fill="#bfdbfe" font-size="13" font-weight="700">5 · State / Memory — what survives between runs</text>
  <text x="586" y="456" text-anchor="middle" fill="#93c5fd" font-size="10.5">tracker (Ch. 18) · CLAUDE.md &amp; skills (Ch. 13) · knowledge graph (Ch. 5–8)</text>
  <text x="586" y="473" text-anchor="middle" fill="#64748b" font-size="10" font-style="italic">without it, run 7 re-attempts what run 3 already rejected</text>

  <line x1="330" y1="394" x2="330" y2="410" stroke="#60a5fa" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#arrowBlue)"/>
  <line x1="600" y1="410" x2="600" y2="394" stroke="#60a5fa" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#arrowBlue)"/>
  <text x="356" y="408" fill="#64748b" font-size="9.5">write</text>
  <text x="608" y="408" fill="#64748b" font-size="9.5">read</text>

  <line x1="924" y1="314" x2="924" y2="440" stroke="#475569" stroke-width="1.4" stroke-dasharray="4 3"/>
</svg>
