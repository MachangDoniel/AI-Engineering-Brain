<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3b82f6"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="900" height="420" rx="12" fill="#0f172a"/>
  <text x="450" y="36" text-anchor="middle" fill="#e2e8f0" font-size="20" font-weight="700">Neo4j Schema — Code as a Graph</text>

  <!-- Repository -->
  <circle cx="120" cy="130" r="44" fill="#4a1d6e" stroke="#a855f7" stroke-width="2"/>
  <text x="120" y="127" text-anchor="middle" fill="#e9d5ff" font-size="12" font-weight="600">:Repository</text>
  <text x="120" y="143" text-anchor="middle" fill="#c4b5fd" font-size="10">mobile-app</text>

  <!-- File -->
  <circle cx="290" cy="130" r="44" fill="#1e3a5f" stroke="#3b82f6" stroke-width="2"/>
  <text x="290" y="127" text-anchor="middle" fill="#bfdbfe" font-size="12" font-weight="600">:File</text>
  <text x="290" y="143" text-anchor="middle" fill="#93c5fd" font-size="10">login.dart</text>
  <line x1="164" y1="130" x2="242" y2="130" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrow3)"/>
  <text x="203" y="120" text-anchor="middle" fill="#94a3b8" font-size="10">CONTAINS</text>

  <!-- Class -->
  <circle cx="460" cy="130" r="44" fill="#1e3a5f" stroke="#3b82f6" stroke-width="2"/>
  <text x="460" y="127" text-anchor="middle" fill="#bfdbfe" font-size="12" font-weight="600">:Class</text>
  <text x="460" y="143" text-anchor="middle" fill="#93c5fd" font-size="10">LoginScreen</text>
  <line x1="334" y1="130" x2="412" y2="130" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrow3)"/>
  <text x="373" y="120" text-anchor="middle" fill="#94a3b8" font-size="10">DEFINES</text>

  <!-- Endpoint -->
  <circle cx="640" cy="130" r="44" fill="#14532d" stroke="#22c55e" stroke-width="2"/>
  <text x="640" y="127" text-anchor="middle" fill="#bbf7d0" font-size="12" font-weight="600">:Endpoint</text>
  <text x="640" y="143" text-anchor="middle" fill="#86efac" font-size="10">POST /auth/login</text>
  <line x1="504" y1="130" x2="592" y2="130" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrow3)"/>
  <text x="548" y="120" text-anchor="middle" fill="#94a3b8" font-size="10">CALLS</text>

  <!-- Service -->
  <circle cx="640" cy="280" r="44" fill="#14532d" stroke="#22c55e" stroke-width="2"/>
  <text x="640" y="277" text-anchor="middle" fill="#bbf7d0" font-size="12" font-weight="600">:Service</text>
  <text x="640" y="293" text-anchor="middle" fill="#86efac" font-size="10">AuthService</text>
  <line x1="640" y1="174" x2="640" y2="232" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrow3)"/>
  <text x="680" y="207" text-anchor="middle" fill="#94a3b8" font-size="10">HANDLED_BY</text>

  <!-- Table -->
  <circle cx="820" cy="280" r="44" fill="#713f12" stroke="#f59e0b" stroke-width="2"/>
  <text x="820" y="277" text-anchor="middle" fill="#fde68a" font-size="12" font-weight="600">:Table</text>
  <text x="820" y="293" text-anchor="middle" fill="#fcd34d" font-size="10">users</text>
  <line x1="684" y1="280" x2="772" y2="280" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrow3)"/>
  <text x="728" y="270" text-anchor="middle" fill="#94a3b8" font-size="10">WRITES</text>

  <!-- Function -->
  <circle cx="460" cy="280" r="44" fill="#1e3a5f" stroke="#3b82f6" stroke-width="2"/>
  <text x="460" y="277" text-anchor="middle" fill="#bfdbfe" font-size="12" font-weight="600">:Function</text>
  <text x="460" y="293" text-anchor="middle" fill="#93c5fd" font-size="10">validateToken()</text>
  <line x1="596" y1="280" x2="508" y2="280" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrow3)"/>
  <text x="552" y="270" text-anchor="middle" fill="#94a3b8" font-size="10">CALLS</text>

  <!-- Document -->
  <circle cx="290" cy="280" r="44" fill="#4a1d3f" stroke="#ec4899" stroke-width="2"/>
  <text x="290" y="277" text-anchor="middle" fill="#fbcfe8" font-size="12" font-weight="600">:Document</text>
  <text x="290" y="293" text-anchor="middle" fill="#f9a8d4" font-size="10">ADR-012 Auth</text>
  <line x1="334" y1="280" x2="412" y2="280" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrow3)"/>
  <text x="373" y="270" text-anchor="middle" fill="#94a3b8" font-size="10">DESCRIBES</text>

  <!-- Cypher example -->
  <rect x="60" y="356" width="780" height="42" rx="8" fill="#1e293b" stroke="#334155"/>
  <text x="450" y="382" text-anchor="middle" fill="#7dd3fc" font-size="13" font-family="Menlo, Consolas, monospace">MATCH (e:Endpoint)-[:HANDLED_BY]-&gt;(:Service)-[:WRITES]-&gt;(t:Table {name:'users'}) RETURN e</text>
</svg>
