<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="900" height="300" rx="12" fill="#0f172a"/>
  <text x="450" y="34" text-anchor="middle" fill="#e2e8f0" font-size="18" font-weight="700">A GraphRAG Query Through MCP</text>

  <!-- Agent -->
  <rect x="30" y="110" width="150" height="70" rx="10" fill="#713f12" stroke="#f59e0b"/>
  <text x="105" y="140" text-anchor="middle" fill="#fde68a" font-size="13" font-weight="600">Coding Agent</text>
  <text x="105" y="160" text-anchor="middle" fill="#fcd34d" font-size="11">"Which screens call</text>
  <text x="105" y="174" text-anchor="middle" fill="#fcd34d" font-size="11">this API?"</text>

  <line x1="180" y1="145" x2="245" y2="145" stroke="#64748b" stroke-width="2" marker-end="url(#arrow4)"/>
  <text x="212" y="135" text-anchor="middle" fill="#94a3b8" font-size="10">tool call</text>

  <!-- MCP -->
  <rect x="250" y="110" width="140" height="70" rx="10" fill="#4a1d6e" stroke="#a855f7"/>
  <text x="320" y="140" text-anchor="middle" fill="#e9d5ff" font-size="13" font-weight="600">MCP Server</text>
  <text x="320" y="160" text-anchor="middle" fill="#c4b5fd" font-size="11">uniform protocol</text>

  <line x1="390" y1="130" x2="465" y2="90" stroke="#64748b" stroke-width="2" marker-end="url(#arrow4)"/>
  <line x1="390" y1="160" x2="465" y2="205" stroke="#64748b" stroke-width="2" marker-end="url(#arrow4)"/>

  <!-- Neo4j -->
  <rect x="470" y="55" width="190" height="66" rx="10" fill="#1e3a5f" stroke="#3b82f6"/>
  <text x="565" y="82" text-anchor="middle" fill="#bfdbfe" font-size="13" font-weight="600">Neo4j — traversal</text>
  <text x="565" y="102" text-anchor="middle" fill="#93c5fd" font-size="11">(:Screen)-[:CALLS]-&gt;(:Endpoint)</text>

  <!-- Qdrant -->
  <rect x="470" y="172" width="190" height="66" rx="10" fill="#4a1d3f" stroke="#ec4899"/>
  <text x="565" y="199" text-anchor="middle" fill="#fbcfe8" font-size="13" font-weight="600">Qdrant — similarity</text>
  <text x="565" y="219" text-anchor="middle" fill="#f9a8d4" font-size="11">related docs &amp; API specs</text>

  <line x1="660" y1="88" x2="735" y2="130" stroke="#64748b" stroke-width="2" marker-end="url(#arrow4)"/>
  <line x1="660" y1="205" x2="735" y2="162" stroke="#64748b" stroke-width="2" marker-end="url(#arrow4)"/>

  <!-- Answer -->
  <rect x="720" y="110" width="150" height="70" rx="10" fill="#14532d" stroke="#22c55e"/>
  <text x="795" y="140" text-anchor="middle" fill="#bbf7d0" font-size="13" font-weight="600">Merged context</text>
  <text x="795" y="160" text-anchor="middle" fill="#86efac" font-size="11">exact file paths,</text>
  <text x="795" y="174" text-anchor="middle" fill="#86efac" font-size="11">no guessing</text>

  <text x="450" y="278" text-anchor="middle" fill="#94a3b8" font-size="12">Graph answers "what depends on this?" · Vectors answer "what is similar to this?"</text>
</svg>
