<style>
  :root {
    color-scheme: light;
    --surface-1:   #fcfcfb;
    --plane:       #f9f9f7;
    --ink-1:       #0b0b0b;
    --ink-2:       #52514e;
    --ink-3:       #898781;
    --grid:        #e1e0d9;
    --baseline:    #c3c2b7;
    --hairline:    rgba(11,11,11,0.10);
    --series-1:    #2a78d6;
    --series-1-soft:#cde2fb;
    --good:        #0ca30c;
    --warning:     #fab219;
    --serious:     #ec835a;
    --critical:    #d03b3b;
    --delta-good:  #006300;
    --radius:      10px;
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) {
      color-scheme: dark;
      --surface-1: #1a1a19;
      --plane:     #0d0d0d;
      --ink-1:     #ffffff;
      --ink-2:     #c3c2b7;
      --ink-3:     #898781;
      --grid:      #2c2c2a;
      --baseline:  #383835;
      --hairline:  rgba(255,255,255,0.10);
      --series-1:  #3987e5;
      --series-1-soft:#184f95;
      --delta-good:#0ca30c;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --surface-1: #1a1a19;
    --plane:     #0d0d0d;
    --ink-1:     #ffffff;
    --ink-2:     #c3c2b7;
    --ink-3:     #898781;
    --grid:      #2c2c2a;
    --baseline:  #383835;
    --hairline:  rgba(255,255,255,0.10);
    --series-1:  #3987e5;
    --series-1-soft:#184f95;
    --delta-good:#0ca30c;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--plane);
    color: var(--ink-1);
    font: 15px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 1120px; margin: 0 auto; padding: 32px 20px 72px; }

  /* ── header ─────────────────────────────────────────────────────────── */
  header.top { display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-start; justify-content: space-between; margin-bottom: 8px; }
  h1 { font-size: 26px; line-height: 1.2; margin: 0 0 6px; letter-spacing: -0.01em; }
  .sub { color: var(--ink-2); font-size: 14px; margin: 0; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .chip { font-size: 12px; color: var(--ink-2); border: 1px solid var(--hairline); border-radius: 999px; padding: 3px 9px; background: var(--surface-1); }
  .toggle {
    font: inherit; font-size: 13px; color: var(--ink-2); cursor: pointer;
    background: var(--surface-1); border: 1px solid var(--hairline);
    border-radius: 8px; padding: 7px 12px;
  }
  .toggle:hover { color: var(--ink-1); }

  /* ── cards ──────────────────────────────────────────────────────────── */
  section.card {
    background: var(--surface-1); border: 1px solid var(--hairline);
    border-radius: var(--radius); padding: 20px; margin-top: 16px;
  }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 0.07em; color: var(--ink-3); margin: 0 0 14px; font-weight: 600; }
  h3 { font-size: 16px; margin: 0 0 4px; }

  /* ── KPI tiles ──────────────────────────────────────────────────────── */
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 1px; background: var(--hairline); border: 1px solid var(--hairline); border-radius: var(--radius); overflow: hidden; margin-top: 20px; }
  .kpi { background: var(--surface-1); padding: 16px 18px; }
  .kpi .v { font-size: 30px; line-height: 1.1; font-weight: 600; letter-spacing: -0.02em; }
  .kpi .k { font-size: 12px; color: var(--ink-3); margin-top: 4px; }
  .kpi .d { font-size: 12px; color: var(--ink-2); margin-top: 2px; }

  /* ── sprint tabs ────────────────────────────────────────────────────── */
  .tabs { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 24px; }
  .tab {
    font: inherit; font-size: 13px; cursor: pointer; padding: 8px 14px;
    border-radius: 8px; border: 1px solid var(--hairline);
    background: var(--surface-1); color: var(--ink-2);
    display: inline-flex; align-items: center; gap: 8px;
  }
  .tab[aria-selected="true"] { background: var(--ink-1); color: var(--plane); border-color: var(--ink-1); }
  .tab .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--baseline); }
  .tab[data-state="active"] .dot { background: var(--good); }
  .tab[data-state="planned"] .dot { background: var(--warning); }

  /* ── goal banner ────────────────────────────────────────────────────── */
  .goal { display: flex; flex-wrap: wrap; gap: 18px; justify-content: space-between; align-items: flex-start; }
  .goal p { margin: 6px 0 0; color: var(--ink-2); max-width: 62ch; }
  .dates { font-size: 13px; color: var(--ink-3); white-space: nowrap; font-variant-numeric: tabular-nums; }

  /* ── status rail (stacked, 2px surface gaps) ────────────────────────── */
  .rail { display: flex; gap: 2px; height: 10px; margin: 18px 0 12px; }
  .rail span { border-radius: 2px; min-width: 2px; }
  .legend { display: flex; flex-wrap: wrap; gap: 16px; font-size: 13px; color: var(--ink-2); }
  .legend .item { display: inline-flex; align-items: center; gap: 7px; }
  .swatch { width: 10px; height: 10px; border-radius: 3px; flex: none; }
  .legend b { color: var(--ink-1); font-variant-numeric: tabular-nums; }

  /* ── metrics strip ──────────────────────────────────────────────────── */
  .metrics { display: grid; grid-template-columns: repeat(auto-fit, minmax(112px, 1fr)); gap: 18px; }
  .metrics div .v { font-size: 20px; font-weight: 600; }
  .metrics div .k { font-size: 12px; color: var(--ink-3); }
  .plus { color: var(--delta-good); }
  .minus { color: var(--critical); }

  /* ── commit chart ───────────────────────────────────────────────────── */
  .chart { position: relative; height: 150px; display: flex; align-items: flex-end; gap: 2px; border-bottom: 1px solid var(--baseline); padding-bottom: 0; }
  .bar { flex: 1; background: var(--series-1); border-radius: 4px 4px 0 0; min-height: 2px; position: relative; cursor: default; transition: opacity .12s; }
  .bar[data-zero="1"] { background: var(--grid); }
  .chart:hover .bar { opacity: .45; }
  .chart .bar:hover { opacity: 1; }
  .xaxis { display: flex; gap: 2px; margin-top: 6px; }
  .xaxis span { flex: 1; text-align: center; font-size: 10px; color: var(--ink-3); font-variant-numeric: tabular-nums; overflow: hidden; }
  #tip {
    position: fixed; pointer-events: none; opacity: 0; transform: translate(-50%, -100%);
    background: var(--ink-1); color: var(--plane); font-size: 12px; line-height: 1.4;
    padding: 6px 9px; border-radius: 6px; white-space: nowrap; z-index: 20; transition: opacity .1s;
  }
  details { margin-top: 14px; }
  summary { font-size: 13px; color: var(--ink-2); cursor: pointer; }

  /* ── tables ─────────────────────────────────────────────────────────── */
  .scroll { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink-3); font-weight: 600; padding: 0 12px 8px 0; border-bottom: 1px solid var(--grid); white-space: nowrap; }
  td { padding: 11px 12px 11px 0; border-bottom: 1px solid var(--grid); vertical-align: top; }
  td.num { font-variant-numeric: tabular-nums; color: var(--ink-2); white-space: nowrap; }
  .id { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; color: var(--ink-3); white-space: nowrap; }
  .files { display: block; font-size: 12px; color: var(--ink-3); margin-top: 3px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }

  /* ── status pills (icon + label — never color alone) ────────────────── */
  .pill { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--ink-2); white-space: nowrap; }
  .pill .swatch { border-radius: 50%; width: 9px; height: 9px; }

  /* ── decisions ──────────────────────────────────────────────────────── */
  .adr { border-left: 2px solid var(--series-1); padding: 2px 0 2px 16px; margin-bottom: 22px; }
  .adr:last-child { margin-bottom: 0; }
  .adr .meta { font-size: 12px; color: var(--ink-3); margin-bottom: 6px; font-variant-numeric: tabular-nums; }
  .adr dl { margin: 10px 0 0; display: grid; grid-template-columns: 108px 1fr; gap: 6px 14px; font-size: 14px; }
  .adr dt { color: var(--ink-3); font-size: 12px; text-transform: uppercase; letter-spacing: 0.05em; padding-top: 2px; }
  .adr dd { margin: 0; color: var(--ink-2); }

  /* ── timeline ───────────────────────────────────────────────────────── */
  .tl { list-style: none; margin: 0; padding: 0; }
  .tl li { display: grid; grid-template-columns: 92px 1fr; gap: 14px; padding: 8px 0; border-bottom: 1px solid var(--grid); font-size: 14px; }
  .tl li:last-child { border-bottom: 0; }
  .tl time { color: var(--ink-3); font-size: 13px; font-variant-numeric: tabular-nums; }
  .tl .kind { color: var(--ink-3); font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; margin-right: 8px; }

  footer { margin-top: 28px; font-size: 12px; color: var(--ink-3); text-align: center; }
  .empty { color: var(--ink-3); font-size: 14px; }
  @media (max-width: 620px) {
    .adr dl { grid-template-columns: 1fr; gap: 2px 0; }
    .tl li { grid-template-columns: 1fr; gap: 2px; }
  }
</style>
</head>

    planned:      { label: "Planned",     color: "var(--baseline)" }
  };
  const SEVERITY = { critical: "var(--critical)", serious: "var(--serious)", warning: "var(--warning)" };
  const ORDER = ["shipped", "review", "in-progress", "blocked", "planned"];

  /* header */
  const P = DATA.project || {};
  $("p-name").textContent = P.name ? `${P.name} — Sprint Tracker` : "Sprint Tracker";
  $("p-sub").textContent = [P.repo, P.owner && `owned by ${P.owner}`, P.updated && `updated ${P.updated}`]
    .filter(Boolean).join("  ·  ");
  $("p-chips").innerHTML = (P.stack || []).map(s => `<span class="chip">${esc(s)}</span>`).join("");
  $("foot").textContent = `Maintained by the coding agent per AGENTS.md — do not hand-edit outside the data block. Generated ${P.updated || "—"}.`;

  const sprints = DATA.sprints || [];
  const all = sprints.flatMap(s => s.features || []);

  /* KPI tiles — all-time */
  const kpis = [
    ["Sprints",       n(sprints.length), `${sprints.filter(s => s.status === "complete").length} complete`],
    ["Features",      n(all.length),     `${all.filter(f => f.status === "shipped").length} shipped`],
    ["Commits",       n(sprints.reduce((a, s) => a + (s.metrics?.commits || 0), 0)), `${n(sprints.reduce((a,s)=>a+(s.metrics?.prsMerged||0),0))} PRs merged`],
    ["Decisions",     n(sprints.reduce((a, s) => a + (s.decisions || []).length, 0)), "logged as ADRs"],
    ["Net lines",     `+${n(sprints.reduce((a,s)=>a+(s.metrics?.linesAdded||0),0))}`, `−${n(sprints.reduce((a,s)=>a+(s.metrics?.linesRemoved||0),0))} removed`],
    ["Open blockers", n(sprints.flatMap(s => s.blockers || []).filter(b => b.status === "open").length), "across all sprints"]
  ];
  $("kpis").innerHTML = kpis.map(([k, v, d]) =>
    `<div class="kpi"><div class="v">${v}</div><div class="k">${k}</div><div class="d">${esc(d)}</div></div>`).join("");

  /* tabs */
  $("tabs").innerHTML = sprints.map((s, i) =>
    `<button class="tab" role="tab" data-i="${i}" data-state="${esc(s.status)}" aria-selected="false">
       <span class="dot"></span>${esc(s.id)} · ${esc(s.name)}</button>`).join("");

  /* tooltip */
  const tip = $("tip");
  const showTip = (e, html) => { tip.innerHTML = html; tip.style.opacity = 1; tip.style.left = e.clientX + "px"; tip.style.top = (e.clientY - 10) + "px"; };
  const hideTip = () => { tip.style.opacity = 0; };

  function pill(status) {
    const s = STATUS[status] || { label: status, color: "var(--baseline)" };
    return `<span class="pill"><span class="swatch" style="background:${s.color}"></span>${esc(s.label)}</span>`;
  }

  function render(i) {
    const s = sprints[i];
    if (!s) return;
    [...$("tabs").children].forEach((t, j) => t.setAttribute("aria-selected", j === i));

    const feats = s.features || [];
    const counts = ORDER.map(k => [k, feats.filter(f => f.status === k).length]).filter(([, c]) => c > 0);
    const total = feats.length || 1;
    const m = s.metrics || {};
    const act = s.commitActivity || [];
    const peak = Math.max(1, ...act.map(d => d.count || 0));

    $("sprint").innerHTML = `
      <section class="card">
        <div class="goal">
          <div>
            <h3>${esc(s.name)}</h3>
            <p>${esc(s.goal)}</p>
          </div>
          <div class="dates">${esc(s.start)} → ${esc(s.end)}<br>${pill(s.status === "complete" ? "shipped" : s.status === "active" ? "in-progress" : "planned")}</div>
        </div>
        <div class="rail" role="img" aria-label="Feature status distribution">
          ${counts.map(([k, c]) => `<span style="flex:${c};background:${STATUS[k].color}"></span>`).join("")}
        </div>
        <div class="legend">
          ${counts.map(([k, c]) => `<span class="item"><span class="swatch" style="background:${STATUS[k].color}"></span>${STATUS[k].label} <b>${c}</b> <span style="color:var(--ink-3)">${Math.round(c / total * 100)}%</span></span>`).join("")}
        </div>
      </section>

      <section class="card">
        <h2>Sprint metrics</h2>
        <div class="metrics">
          <div><div class="v">${n(m.commits)}</div><div class="k">Commits</div></div>
          <div><div class="v">${n(m.prsMerged)}</div><div class="k">PRs merged</div></div>
          <div><div class="v">${n(m.filesChanged)}</div><div class="k">Files changed</div></div>
          <div><div class="v"><span class="plus">+${n(m.linesAdded)}</span></div><div class="k">Lines added</div></div>
          <div><div class="v"><span class="minus">−${n(m.linesRemoved)}</span></div><div class="k">Lines removed</div></div>
          <div><div class="v">${n(m.testsAdded)}</div><div class="k">Tests added</div></div>
          <div><div class="v">${m.coverage != null ? m.coverage + "%" : "—"}</div><div class="k">Coverage</div></div>
          <div><div class="v">${n(feats.reduce((a, f) => a + (f.points || 0), 0))}</div><div class="k">Points</div></div>
        </div>
      </section>

      <section class="card">
        <h2>Commits per day</h2>
        <div class="chart" id="chart">
          ${act.map(d => `<div class="bar" data-zero="${(d.count||0) === 0 ? 1 : 0}" style="height:${Math.max(2, (d.count||0)/peak*100)}%" data-t="${esc(d.date)} · ${d.count||0} commit${(d.count||0)===1?"":"s"}"></div>`).join("")}
        </div>
        <div class="xaxis">${act.map((d, j) => `<span>${act.length > 16 && j % 2 ? "" : day(d.date)}</span>`).join("")}</div>
        <details>
          <summary>View as table</summary>
          <div class="scroll"><table><thead><tr><th>Date</th><th>Commits</th></tr></thead><tbody>
            ${act.map(d => `<tr><td class="num">${esc(d.date)}</td><td class="num">${d.count || 0}</td></tr>`).join("")}
          </tbody></table></div>
        </details>
      </section>

      <section class="card">
        <h2>Features &amp; work items (${feats.length})</h2>
        <div class="scroll"><table>
          <thead><tr><th>ID</th><th>Item</th><th>Type</th><th>Status</th><th>Owner</th><th>Pts</th><th>Commits</th></tr></thead>
          <tbody>${feats.map(f => `
            <tr>
              <td class="id">${esc(f.id)}</td>
              <td>${esc(f.title)}${f.notes ? `<span class="files" style="font-family:inherit;color:var(--ink-2)">${esc(f.notes)}</span>` : ""}${(f.files || []).length ? `<span class="files">${esc((f.files || []).join(" · "))}</span>` : ""}</td>
              <td class="num">${esc(f.type || "—")}</td>
              <td>${pill(f.status)}</td>
              <td class="num">${esc(f.owner || "—")}</td>
              <td class="num">${f.points ?? "—"}</td>
              <td class="num">${f.commits ?? "—"}</td>
            </tr>`).join("") || `<tr><td colspan="7" class="empty">No items recorded yet.</td></tr>`}
          </tbody>
        </table></div>
      </section>

      <section class="card">
        <h2>Decision log (${(s.decisions || []).length})</h2>
        ${(s.decisions || []).map(d => `
          <div class="adr">
            <div class="meta">${esc(d.id)} · ${esc(d.date)} · ${esc(d.status || "accepted")}</div>
            <h3>${esc(d.title)}</h3>
            <dl>
              <dt>Context</dt><dd>${esc(d.context)}</dd>
              <dt>Decision</dt><dd>${esc(d.decision)}</dd>
              ${(d.alternatives || []).length ? `<dt>Rejected</dt><dd>${(d.alternatives || []).map(esc).join("<br>")}</dd>` : ""}
              <dt>Consequences</dt><dd>${esc(d.consequences)}</dd>
            </dl>
          </div>`).join("") || `<p class="empty">No decisions recorded yet.</p>`}
      </section>

      <section class="card">
        <h2>Blockers &amp; risks</h2>
        <div class="scroll"><table>
          <thead><tr><th>Item</th><th>Severity</th><th>Raised</th><th>Owner</th><th>Status</th></tr></thead>
          <tbody>${(s.blockers || []).map(b => `
            <tr>
              <td>${esc(b.title)}${b.note ? `<span class="files" style="font-family:inherit;color:var(--ink-2)">${esc(b.note)}</span>` : ""}</td>
              <td><span class="pill"><span class="swatch" style="background:${SEVERITY[b.severity] || "var(--baseline)"}"></span>${esc(b.severity)}</span></td>
              <td class="num">${esc(b.raised)}</td>
              <td class="num">${esc(b.owner || "—")}</td>
              <td class="num">${esc(b.status)}</td>
            </tr>`).join("") || `<tr><td colspan="5" class="empty">Nothing blocked.</td></tr>`}
          </tbody>
        </table></div>
      </section>

      <section class="card">
        <h2>Timeline</h2>
        <ul class="tl">${(s.timeline || []).map(t => `
          <li><time>${esc(t.date)}</time><span><span class="kind">${esc(t.type)}</span>${esc(t.text)}</span></li>`).join("")
          || `<li class="empty">No events yet.</li>`}
        </ul>
      </section>`;

    const chart = $("chart");
    if (chart) {
      chart.addEventListener("mousemove", (e) => {
        const b = e.target.closest(".bar");
        b ? showTip(e, esc(b.dataset.t)) : hideTip();
      });
      chart.addEventListener("mouseleave", hideTip);
    }
  }

  $("tabs").addEventListener("click", (e) => {
    const t = e.target.closest(".tab");
    if (t) render(+t.dataset.i);
  });

  $("theme").addEventListener("click", () => {
    const dark = matchMedia("(prefers-color-scheme: dark)").matches;
    const cur = document.documentElement.dataset.theme || (dark ? "dark" : "light");
    document.documentElement.dataset.theme = cur === "dark" ? "light" : "dark";
  });

  render(0);
})();
</script>
</body>
</html>
